services:
  # FastAPI Backend Service (Render Web Service)
  - type: web
    name: melitta-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # DB는 2026-06부터 Neon PostgreSQL. 연결 주소는 Render 대시보드에서 직접 넣는다.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
