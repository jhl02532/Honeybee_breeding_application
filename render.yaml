services:
  # FastAPI Backend Service (Render Web Service)
  - type: web
    name: melittabreed-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: melittabreed-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  # Render PostgreSQL Database
  - name: melittabreed-db
    plan: free
